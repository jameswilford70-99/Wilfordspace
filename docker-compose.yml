services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wilfordspace}
      POSTGRES_USER: ${POSTGRES_USER:-wilfordspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-wilfordspace} -d $${POSTGRES_DB:-wilfordspace}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wilfordspace}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-wilfordspace}
      SECRET_KEY: ${SECRET_KEY:-change-this-development-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CALENDAR_FEED_TOKEN: ${CALENDAR_FEED_TOKEN}
      WILFORDSPACE_PUBLIC_URL: ${WILFORDSPACE_PUBLIC_URL:-https://wilfordspace.wilfordhome.uk}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
